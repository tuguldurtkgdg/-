<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хүүхдийн өндөр таамаглагч - Tk studio</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card-wrap {
      padding: 3px;
      border-radius: 26px;
      background: linear-gradient(135deg, #ff9a56, #ffd166, #6bcb77, #4fb0e0, #8b5cf6, #ec4899);
      background-size: 300% 300%;
      animation: borderShift 8s ease infinite;
      box-shadow: 0 20px 45px rgba(60, 20, 90, 0.35);
      max-width: 420px;
      width: 100%;
    }

    @keyframes borderShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 23px;
      padding: 30px 22px;
      text-align: center;
      color: #3b0764;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(139,92,246,0.4);
    }

    h2 {
      color: #4c1d95;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 700;
    }

    .btn {
      background-color: #8b5cf6;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(139,92,246,0.35);
      margin-top: 8px;
    }

    .btn:hover { background-color: #7c3aed; transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .input-group {
      margin-bottom: 14px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 13.5px;
      color: #581c87;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid #d8b4fe;
      background: #fff;
      color: #3b0764;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input::placeholder { color: #c084fc; }
    input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.18); }

    .choice-row { display: flex; gap: 7px; }

    .choice-btn {
      flex: 1;
      padding: 10px 4px;
      border: 2px solid #d8b4fe;
      border-radius: 10px;
      background: #fff;
      color: #6b21a8;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      text-align: center;
    }

    .choice-btn:hover { border-color: #8b5cf6; background: #f3e8ff; }
    .choice-btn.selected {
      background: #8b5cf6;
      color: #fff;
      border-color: #8b5cf6;
      box-shadow: 0 3px 10px rgba(139,92,246,0.35);
    }

    /* Бөөрөнхий диаграмм */
    .circle-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }

    .circle-svg { transform: rotate(-90deg); }

    .circle-bg { fill: none; stroke: #ede0fa; stroke-width: 14; }

    .circle-progress {
      fill: none;
      stroke: url(#redGrad);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: 565;
      stroke-dashoffset: 565;
      transition: stroke-dashoffset 1.8s cubic-bezier(.4,0,.2,1);
    }

    .circle-inner {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .circle-label {
      font-size: 13px;
      color: #7c3aed;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
    }

    .circle-value {
      font-size: 46px;
      font-weight: 800;
      color: #cc0000;
      line-height: 1;
      margin: 4px 0 2px;
    }

    .circle-unit {
      font-size: 16px;
      color: #7c3aed;
      font-weight: 600;
    }

    .result-range {
      font-size: 13px;
      color: #7c3aed;
      margin-bottom: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="card-wrap">
<div class="card">
  <div class="badge">Tk studio</div>

  <!-- 1-р алхам -->
  <div id="step-start">
    <h2>Хэр өндөр болохыг чинь үзээд өгье хөөрхнөө! 🧸✨</h2>
    <button class="btn" id="start-btn">▶ Эхлэх (Play)</button>
  </div>

  <!-- 2-р алхам -->
  <div id="step-form" style="display:none;">
    <h2>Мэдээллээ оруулна уу 📝</h2>

    <div class="input-group">
      <label>Хүйс:</label>
      <div class="choice-row" id="row-gender">
        <button type="button" class="choice-btn" onclick="choose(this,'gender')">Хүү</button>
        <button type="button" class="choice-btn" onclick="choose(this,'gender')">Охин</button>
      </div>
    </div>

    <div class="input-group">
      <label for="father">Аавын өндөр (см):</label>
      <input type="number" id="father" placeholder="жишээ нь: 175">
    </div>

    <div class="input-group">
      <label for="mother">Ээжийн өндөр (см):</label>
      <input type="number" id="mother" placeholder="жишээ нь: 162">
    </div>

    <div class="input-group">
      <label for="growth">Сүүлийн жилд хэдэн см өссөн бэ?</label>
      <input type="number" id="growth" placeholder="жишээ нь: 7">
    </div>

    <div class="input-group">
      <label for="acne">Сүүлийн жилд хэр их батга гарсан бэ? (1–10)</label>
      <input type="number" id="acne" placeholder="жишээ нь: 5" min="1" max="10">
    </div>

    <div class="input-group">
      <label for="weight">Сүүлийн жилд хэдэн кг таргалсан бэ?</label>
      <input type="number" id="weight" placeholder="жишээ нь: 3">
    </div>

    <div class="input-group">
      <label>Сүүлийн жилд хөлийн хэмжээ хэр томорсон бэ?</label>
      <div class="choice-row" id="row-foot">
        <button type="button" class="choice-btn" onclick="choose(this,'foot')">Бага</button>
        <button type="button" class="choice-btn" onclick="choose(this,'foot')">Бага зэрэг</button>
        <button type="button" class="choice-btn" onclick="choose(this,'foot')">Их</button>
      </div>
    </div>

    <div class="input-group">
      <label>Сүүлийн жилд булчингийн масс хэр их нэмсэн бэ?</label>
      <div class="choice-row" id="row-muscle">
        <button type="button" class="choice-btn" onclick="choose(this,'muscle')">Бага</button>
        <button type="button" class="choice-btn" onclick="choose(this,'muscle')">Бага зэрэг</button>
        <button type="button" class="choice-btn" onclick="choose(this,'muscle')">Их</button>
      </div>
    </div>

    <div class="input-group">
      <label>Сүүлийн жилд үс ургалт хэр байсан бэ?</label>
      <div class="choice-row" id="row-hair">
        <button type="button" class="choice-btn" onclick="choose(this,'hair')">Бага</button>
        <button type="button" class="choice-btn" onclick="choose(this,'hair')">Бага зэрэг</button>
        <button type="button" class="choice-btn" onclick="choose(this,'hair')">Их</button>
      </div>
    </div>

    <div class="input-group">
      <label>Орой хэд гээд унтдаг вэ?</label>
      <div class="choice-row" id="row-sleep">
        <button type="button" class="choice-btn" onclick="choose(this,'sleep')">8–10</button>
        <button type="button" class="choice-btn" onclick="choose(this,'sleep')">10–12</button>
        <button type="button" class="choice-btn" onclick="choose(this,'sleep')">+12</button>
      </div>
    </div>

    <div class="input-group">
      <label>Өглөө хэд гээд сэрдэг вэ?</label>
      <div class="choice-row" id="row-wake">
        <button type="button" class="choice-btn" onclick="choose(this,'wake')">4–6</button>
        <button type="button" class="choice-btn" onclick="choose(this,'wake')">6–8</button>
        <button type="button" class="choice-btn" onclick="choose(this,'wake')">+8</button>
      </div>
    </div>

    <button class="btn" id="calc-btn">Үзэх 🚀</button>
  </div>

  <!-- 3-р алхам -->
  <div id="step-result" style="display:none;">
    <h2>Ирээдүйд болох өндөр:</h2>

    <div class="circle-container">
      <svg class="circle-svg" width="200" height="200" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#cc0000;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ff4444;stop-opacity:1" />
          </linearGradient>
        </defs>
        <circle class="circle-bg" cx="100" cy="100" r="90"/>
        <circle class="circle-progress" id="circle-prog" cx="100" cy="100" r="90"/>
      </svg>
      <div class="circle-inner">
        <div class="circle-label">Боломжит<br>өндөр</div>
        <div class="circle-value" id="height-result">—</div>
        <div class="circle-unit">см</div>
      </div>
    </div>

    <div class="result-range" id="height-range"></div>
    <button class="btn" id="reset-btn">Дэлгэрэнгүй статистик 💯👍🏻</button>
  </div>

</div>
</div>

<script>
  var selectedGroups = {};

  function choose(btn, group) {
    var siblings = btn.parentElement.querySelectorAll('.choice-btn');
    siblings.forEach(function(b) { b.classList.remove('selected'); });
    btn.classList.add('selected');
    selectedGroups[group] = btn.textContent.trim();
  }

  document.addEventListener("DOMContentLoaded", function() {
    var stepStart  = document.getElementById('step-start');
    var stepForm   = document.getElementById('step-form');
    var stepResult = document.getElementById('step-result');

    document.getElementById('start-btn').onclick = function() {
      stepStart.style.display = 'none';
      stepForm.style.display  = 'block';
    };

    document.getElementById('calc-btn').onclick = function() {
      var father = parseFloat(document.getElementById('father').value);
      var mother = parseFloat(document.getElementById('mother').value);
      var growth = parseFloat(document.getElementById('growth').value);
      var acne   = parseFloat(document.getElementById('acne').value);
      var weight = parseFloat(document.getElementById('weight').value);

      var requiredGroups = ['gender','foot','muscle','hair','sleep','wake'];

      if (!father || !mother) { alert("Аав, ээжийн өндрийг оруулна уу!"); return; }
      if (!growth)            { alert("Сүүлийн жилд хэдэн см өссөнөө оруулна уу!"); return; }
      if (!acne)              { alert("Батгын мэдээллийг оруулна уу!"); return; }
      if (!weight)            { alert("Хэдэн кг таргалсанаа оруулна уу!"); return; }

      for (var i = 0; i < requiredGroups.length; i++) {
        if (!selectedGroups[requiredGroups[i]]) {
          alert("Бүх асуултад хариулна уу!");
          return;
        }
      }

      var gender = selectedGroups['gender'] === 'Хүү' ? 'boy' : 'girl';
      var predictedHeight = gender === 'boy'
        ? (father + mother) / 2 + 6.5
        : (father + mother) / 2 - 6.5;
      predictedHeight = Math.round(predictedHeight * 10) / 10;

      var low  = Math.round((predictedHeight - 8.5) * 10) / 10;
      var high = Math.round((predictedHeight + 8.5) * 10) / 10;

      document.getElementById('height-result').textContent = predictedHeight;
      document.getElementById('height-range').textContent  = 'Боломжит хүрээ: ' + low + '–' + high + ' см';

      stepForm.style.display   = 'none';
      stepResult.style.display = 'block';

      setTimeout(function() {
        var minH = 140, maxH = 210;
        var pct  = Math.min(1, Math.max(0, (predictedHeight - minH) / (maxH - minH)));
        var circ = 2 * Math.PI * 90;
        document.getElementById('circle-prog').style.strokeDasharray  = circ;
        document.getElementById('circle-prog').style.strokeDashoffset = circ * (1 - pct);
      }, 80);
    };

    document.getElementById('reset-btn').onclick = function() {
      ['father','mother','growth','acne','weight'].forEach(function(id) {
        document.getElementById(id).value = '';
      });
      document.querySelectorAll('.choice-btn').forEach(function(b) {
        b.classList.remove('selected');
      });
      selectedGroups = {};
      document.getElementById('circle-prog').style.strokeDashoffset = 2 * Math.PI * 90;
      stepResult.style.display = 'none';
      stepStart.style.display  = 'block';
    };
  });
</script>
</body>
</html>
