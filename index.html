<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хүүхдийн өндөр таамаглагч - Tk studio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; width: 100%; position: relative; }
        .brand { position: absolute; top: 15px; right: 15px; font-weight: bold; font-size: 13px; color: #777; background: #eee; padding: 4px 8px; border-radius: 5px; }
        .intro-text { text-align: center; color: #333; font-size: 17px; font-weight: bold; margin-top: 25px; line-height: 1.4; }
        .play-btn { background: #007bff; color: white; font-size: 18px; font-weight: bold; padding: 12px; border: none; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .play-btn:hover { background: #0056b3; }
        #form-section { display: none; margin-top: 15px; }
        label { font-size: 14px; font-weight: bold; color: #555; display: block; margin-top: 12px; }
        input, select { width: 100%; padding: 11px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; }
        .calc-btn { background: #28a745; color: white; font-weight: bold; border: none; padding: 12px; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 20px; font-size: 15px; }
        .calc-btn:hover { background: #218838; }
        #result { margin-top: 20px; padding: 15px; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 6px; display: none; text-align: center; }
        .encouraging-text { background: #e3f2fd; padding: 12px; border-radius: 6px; font-size: 13px; color: #0d47a1; margin-top: 10px; font-weight: bold; line-height: 1.4; }
        .tips { margin-top: 15px; background: #fff3cd; padding: 10px; border-radius: 5px; font-size: 12px; color: #856404; text-align: left; }
    </style>
</head>
<body>

<div class="card">
    <div class="brand">Tk studio</div>

    <!-- Анх харагдах хэсэг -->
    <div id="start-section">
        <p class="intro-text">Xэр өндөр болохыг чинь үзээд өгье хөөрхнөө! ✨🤍</p>
        <button class="play-btn" onclick="startApp()">▶ Эхлэх (Play)</button>
    </div>

    <!-- Асуултуудын хэсэг -->
    <div id="form-section">
        <label>Хүүхдийн хүйс:</label>
        <select id="gender">
            <option value="boy">Хүү</option>
            <option value="girl">Охин</option>
        </select>

        <label>Аавын өндөр (см):</label>
        <input type="number" id="dad" placeholder="Жишээ нь: 175">

        <label>Ээжийн өндөр (см):</label>
        <input type="number" id="mom" placeholder="Жишээ нь: 162">

        <label>Хүүхдийн одоогийн өндөр (см):</label>
        <input type="number" id="childHeight" placeholder="Жишээ нь: 110">

        <label>Хүүхдийн нас:</label>
        <input type="number" id="childAge" placeholder="Жишээ нь: 6">

        <button class="calc-btn" onclick="calculateHeight()">ҮНЭГҮЙ ТОӨЦООЛОХ</button>

        <div id="result"></div>
    </div>
</div>

<script>
function startApp() {
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('form-section').style.display = 'block';
}

function calculateHeight() {
    let dad = parseFloat(document.getElementById('dad').value);
    let mom = parseFloat(document.getElementById('mom').value);
    let gender = document.getElementById('gender').value;

    if (!dad || !mom) {
        alert("Аав болон ээжийн өндрийг заавал оруулна уу!");
        return;
    }

    let predictedHeight = 0;
    if (gender === 'boy') {
        predictedHeight = (dad + mom + 13) / 2;
    } else {
        predictedHeight = (dad + mom - 13) / 2;
    }

    let resultDiv = document.getElementById('result');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `
        <h3 style="color:#2e7d32; margin-top:0;">Тооцооллын үр дүн:</h3>
        <p>Боломжит өндөр:</p>
        <h2 style="color:#1b5e20; margin:5px 0;">${predictedHeight - 4} см - ${predictedHeight + 4} см</h2>
        
        <div class="encouraging-text">
            Энэ өндрийг таны ээж, аав болон чиний өндөр, жин дээр тулгуурлаад хийсэн тул үүнээс ч өндөр болж болно шүү, мундаг аа! 🥰
        </div>

        <div class="tips">
            <b>Өндөр болоход нөлөөлөх хүчин зүйлс:</b><br>
            • Унтаж амрах (22:00 цагаас өмнө унтах)<br>
            • Кальци ба D витамины хэрэглээ<br>
            • Сагсан бөмбөг, суниалт зэрэг өсөлтийн дасгалууд
        </div>
    `;
}
</script>

</body>
</html>
