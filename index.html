<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хүүхдийн өндөр таамаглагч - Tk studio</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 3-р сонголт: Зөөлөн ягаан уусалттай карт */
    .card {
      background: rgba(243, 232, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 12px 32px rgba(124, 58, 237, 0.15);
      max-width: 420px;
      width: 100%;
      text-align: center;
      color: #3b0764;
    }

    .badge {
      display: inline-block;
      background-color: rgba(168, 85, 247, 0.2);
      color: #6b21a8;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    h2 {
      color: #4c1d95;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 700;
    }

    .btn {
      background-color: #8b5cf6;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
    }

    .btn:hover {
      background-color: #7c3aed;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      color: #581c87;
      margin-bottom: 5px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8b4fe;
      background: #ffffff;
      color: #3b0764;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: #a855f7;
    }

    input:focus, select:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    .result-val {
      font-size: 38px;
      font-weight: 800;
      color: #6d28d9;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Tk studio</div>

    <!-- 1-р алхам -->
    <div id="step-start" style="display: block;">
      <h2>Хэр өндөр болохыг чинь үзээд өгье хөөрхнөө! 🤍✨</h2>
      <button class="btn" id="start-btn">▶ Эхлэх (Play)</button>
    </div>

    <!-- 2-р алхам -->
    <div id="step-form" style="display: none;">
      <h2>Мэдээллээ оруулна уу 📝</h2>
      
      <div class="input-group">
        <label for="gender">Хүйс:</label>
        <select id="gender">
          <option value="boy">Хүү</option>
          <option value="girl">Охин</option>
        </select>
      </div>

      <div class="input-group">
        <label for="father">Аавын өндөр (см):</label>
        <input type="number" id="father" placeholder="жишээ нь: 175">
      </div>

      <div class="input-group">
        <label for="mother">Ээжийн өндөр (см):</label>
        <input type="number" id="mother" placeholder="жишээ нь: 162">
      </div>

      <button class="btn" id="calc-btn">Үзэх 🚀</button>
    </div>

    <!-- 3-р алхам -->
    <div id="step-result" style="display: none;">
      <h2>Ирээдүйд болох өндөр:</h2>
      <div class="result-val" id="height-result">175 см</div>
      <p style="color: #6b21a8; font-size: 14px; font-weight: 600;">(Эрүүл зөв хооллолт, дасгал хөдөлгөөнөө сайн хийгээрэй! 💪)</p>
      <br>
      <button class="btn" id="reset-btn">Дахин үзэх 🔄</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var stepStart = document.getElementById('step-start');
      var stepForm = document.getElementById('step-form');
      var stepResult = document.getElementById('step-result');

      document.getElementById('start-btn').onclick = function() {
        stepStart.style.display = 'none';
        stepForm.style.display = 'block';
      };

      document.getElementById('calc-btn').onclick = function() {
        var gender = document.getElementById('gender').value;
        var father = parseFloat(document.getElementById('father').value);
        var mother = parseFloat(document.getElementById('mother').value);

        if (!father || !mother) {
          alert("Аав, ээжийн өндрийг бүрэн оруулна уу!");
          return;
        }
