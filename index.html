<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хүүхдийн өндөр таамаглагч - Tk studio</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Тунгалаг шилэн карт (Glassmorphism) */
    .card {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background-color: rgba(255, 255, 255, 0.6);
      color: #1e293b;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    h2 {
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 700;
    }

    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      color: #1e293b;
      margin-bottom: 5px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #2563eb;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .hidden {
      display: none;
    }

    .result-val {
      font-size: 36px;
      font-weight: 800;
      color: #1e40af;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Tk studio</div>

    <!-- 1-р алхам: Эхлэл -->
    <div id="step-start">
      <h2>Хэр өндөр болохыг чинь үзээд өгье хөөрхнөө! 🤍✨</h2>
      <button class="btn" onclick="nextStep('step-start', 'step-form')">▶ Эхлэх (Play)</button>
    </div>

    <!-- 2-р алхам: Мэдээлэл авах -->
    <div id="step-form" class="hidden">
      <h2>Мэдээллээ оруулна уу 📝</h2>
      
      <div class="input-group">
        <label for="gender">Хүйс:</label>
        <select id="gender">
          <option value="boy">Хүү</option>
          <option value="girl">Охин</option>
        </select>
      </div>

      <div class="input-group">
        <label for="father">Аавын өндөр (см):</label>
        <input type="number" id="father" placeholder="жишээ нь: 175">
      </div>

      <div class="input-group">
        <label for="mother">Ээжийн өндөр (см):</label>
        <input type="number" id="mother" placeholder="жишээ нь: 162">
      </div>

      <button class="btn" onclick="calculateHeight()">Үзэх 🚀</button>
    </div>

    <!-- 3-р алхам: Үр дүн -->
    <div id="step-result" class="hidden">
      <h2>Ирээдүйд болох өндөр:</h2>
      <div class="result-val" id="height-result">175 см</div>
      <p style="color: #334155; font-size: 14px; font-weight: 600;">(Эрүүл зөв хооллолт, дасгал хөдөлгөөнөө сайн хийгээрэй! 💪)</p>
      <br>
      <button class="btn" onclick="nextStep('step-result', 'step-start')">Дахин үзэх 🔄</button>
    </div>
  </div>

  <script>
    function nextStep(current, next) {
      document.getElementById(current).classList.add('hidden');
      document.getElementById(next).classList.remove('hidden');
    }

      const father = parseFloat(document.getElementById('father').value);
      const mother = parseFloat(document.getElementById('mother').value);

        return;
      }
